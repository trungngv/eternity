[project]
name = "eternity"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "mistune>=3.0.0",
    "pyyaml>=6.0.0",
    "uvicorn[standard]>=0.32.0",
    "yt-dlp>=2024.1.0",
    "youtube-transcript-api>=0.6.0",
]

[project.scripts]
eternity = "eternity.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eternity"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
